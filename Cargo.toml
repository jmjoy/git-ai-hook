[package]
name = "git-ai-hook"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["jmjoy <jmjoy@apache.org>"]
description = "AI-powered Git hook that generates Conventional Commit messages from staged diffs"
repository = "https://github.com/jmjoy/git-ai-hook"
readme = "README.md"
license = "MulanPSL-2.0"
keywords = ["git", "commit", "ai", "hook", "conventional-commits"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
git2 = "0.21"
indicatif = "0.18"
rig-core = "0.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.9"
